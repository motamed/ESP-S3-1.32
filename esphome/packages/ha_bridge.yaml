# Home Assistant bridge.
#
# The device deliberately knows nothing about your entity IDs. ESPHome
# subscribes to Home Assistant entities at compile time, so anything hardcoded
# here would force every user to rebuild the firmware.
#
# Instead the device exposes generic, writable slots. Home Assistant pushes
# values into them with ordinary service calls (number.set_value,
# text.set_value, switch.turn_on), which the bundled blueprint wires up to
# whatever entities you pick in the UI. Nothing is compiled in, so setup is
# entirely point-and-click.

number:
  - platform: template
    id: ui_temperature
    name: Temperature slot
    entity_category: config
    icon: mdi:thermometer
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -100
    max_value: 200
    step: 0.1
    on_value:
      - lvgl.label.update:
          id: sensor_temp_value
          text: !lambda return str_sprintf("%.1f°", x);

  - platform: template
    id: ui_humidity
    name: Humidity slot
    entity_category: config
    icon: mdi:water-percent
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 100
    step: 1
    on_value:
      - lvgl.label.update:
          id: sensor_humidity_value
          text: !lambda return str_sprintf("%.0f%%", x);
      - lvgl.arc.update:
          id: humidity_arc
          value: !lambda return x;

text:
  - platform: template
    id: ui_weather
    name: Weather slot
    entity_category: config
    icon: mdi:weather-partly-cloudy
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
    on_value:
      - lvgl.label.update:
          id: clock_weather
          text: !lambda return x;

  - platform: template
    id: ui_tile_1_label
    name: Tile 1 label
    entity_category: config
    icon: mdi:label-outline
    optimistic: true
    restore_value: true
    initial_value: "Tile 1"
    mode: text
    on_value:
      - lvgl.label.update:
          id: light_1_label
          text: !lambda return x;

  - platform: template
    id: ui_tile_2_label
    name: Tile 2 label
    entity_category: config
    icon: mdi:label-outline
    optimistic: true
    restore_value: true
    initial_value: "Tile 2"
    mode: text
    on_value:
      - lvgl.label.update:
          id: light_2_label
          text: !lambda return x;

switch:
  # These mirror whichever lights you pick in the blueprint. Tapping a tile
  # flips the switch; the blueprint sees that and toggles the real light, then
  # writes the resulting state back here.
  - platform: template
    id: ui_tile_1
    name: Tile 1
    icon: mdi:lightbulb
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lvgl.widget.update:
          id: light_1_button
          state:
            checked: true
    on_turn_off:
      - lvgl.widget.update:
          id: light_1_button
          state:
            checked: false

  - platform: template
    id: ui_tile_2
    name: Tile 2
    icon: mdi:lightbulb
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lvgl.widget.update:
          id: light_2_button
          state:
            checked: true
    on_turn_off:
      - lvgl.widget.update:
          id: light_2_button
          state:
            checked: false
